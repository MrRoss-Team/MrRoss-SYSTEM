[greeter]
background = /usr/share/backgrounds/mrross/login.png
theme-name = MrRoss-Dark
font-name = Cantarell 11
icon-theme-name = MrRoss
xft-antialias = true
xft-dpi = 96
xft-hintstyle = slight
xft-rgba = rgb
indicators = ~host;~spacer;~session;~layout;~a11y;~clock;~power;
clock-format = %d %b, %H:%M
screensaver-timeout = 60
default-user-image = #mrross-logo
keyboard = onboard
